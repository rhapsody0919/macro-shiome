name: Daily data fetch

on:
  schedule:
    # UTC 毎日 02:00 = 米国東部の前日 21〜22 時 (市場は閉場後)。
    # この時刻なら `previousTradingDay` が「直前に閉じた取引セッション」を指す (#133)。
    # 日次にする理由: 無料枠で日次ヒストリカルを取れる経路が無く、
    # 現在値を毎日積み上げるしかないため (#136)。
    - cron: '0 2 * * *'
  workflow_dispatch:

# data/ を commit するため書き込み権限が要る。
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Cloudflare Pages のビルドも同じファイルを読む (ADR-0005)。
          # ここを直書きすると本番ビルドと CI で Node が食い違う。
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # secrets は env で渡す。コマンドラインに書くと ps や set -x で見える。
      # public リポの Actions ログは誰でも読めるため、値を echo しない。
      - name: Fetch data
        id: fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          # AI要約 (#279、ADR-0009)。未設定でも致命的にはしない — 言語化だけを
          # スキップし、警告/ハイライトの機械判定 (ネットワーク不要) は続行する。
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
        run: pnpm fetch:daily

      # **取得の直後に一次情報と突き合わせる** (#113)。取得実装と違う経路
      # (API キーを使わない CSV) で照合するので、実装の取り違えも検出できる。
      # 失敗しても後段でコミットは行う。「緑だが歯抜け」と同じで、
      # 「値が違うが記録されていない」状態を作らないため。
      - name: Verify values
        id: verify
        if: always()
        # FRED はキー無しの CSV 経路で照合するのでキーを渡さない。
        # e-Stat 統計 API (#160) と Finnhub (#224) は**キー無しの経路が存在しない**。
        # Tiingo (#229) は observations ファイルを直接読むだけで、
        # 照合先の Finnhub 側にしかキーを使わないため TIINGO_API_KEY は不要。
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: pnpm verify

      # 取得が一部失敗しても、取れた分はコミットする (次回の差分を小さくするため)。
      # job 自体は後段で失敗させる。
      - name: Commit data
        if: always()
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "data/ に差分なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(#9): データを更新する [why: 定期取得]"
          # 実行中に別の push があると reject されるため、rebase してから送る。
          # data/ は観測日をキーにした UPSERT で衝突しにくく、rebase で安全に載せられる。
          git pull --rebase origin main
          git push

      # 取得ステップが失敗していたら job を赤にする。
      # 「緑だが歯抜け」を作らないため、部分的な成功を成功として扱わない。
      - name: Fail if verify failed
        if: always() && steps.verify.outcome == 'failure'
        run: |
          echo "値の検証に失敗した。取得できた値が一次情報と食い違っている" >&2
          exit 1

      - name: Fail if fetch failed
        if: always() && steps.fetch.outcome == 'failure'
        run: |
          echo "取得または検証に失敗した項目がある。上のログを確認する"
          exit 1
