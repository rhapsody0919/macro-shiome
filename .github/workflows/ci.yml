name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Cloudflare Pages のビルドも同じファイルを読む (ADR-0005)。
          # ここを直書きすると本番ビルドと CI で Node が食い違う。
          node-version-file: .node-version
          cache: pnpm

      # allowBuilds (pnpm-workspace.yaml) が無いと unrs-resolver のビルドが拒否され
      # install が exit 1 になる。
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # ネットワーク照合は毎 push には重いので --offline。一次情報との突き合わせは
      # 週次バッチの後に `pnpm verify` を手で回す (#113)。
      - name: 値の検証 (オフライン)
        run: pnpm verify --offline
