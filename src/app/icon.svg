<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="macro-shiome">
  <!--
    favicon (#70)。「潮目」= 相場の転換点を、上昇 → 頂点 → 下落の折れ線と
    頂点の点で表す。16px でも潰れないよう線幅 3、要素は 3 つだけにする。

    **背景を塗る**のがこのアイコンの要点。透過にすると、ライトとダークで
    ブラウザのタブ背景が変わったときにどちらかで見えなくなる。
  -->
  <rect width="32" height="32" rx="7" fill="#0e7490"/>
  <path d="M4 24 L18 9 L28 20" fill="none" stroke="#ffffff" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="18" cy="9" r="3.4" fill="#fbbf24"/>
</svg>
